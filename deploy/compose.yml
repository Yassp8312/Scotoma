name: scotoma-relay

services:
  relay:
    image: ${SCOTOMA_RELAY_IMAGE:-scotoma-relay:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCOTOMA_PUBLIC_LISTEN_ADDR: 0.0.0.0:8787
      SCOTOMA_ADMIN_LISTEN_ADDR: 127.0.0.1:8788
    expose:
      - "8787"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    init: true
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      - relay
    environment:
      SCOTOMA_DOMAIN: ${SCOTOMA_DOMAIN:?Set SCOTOMA_DOMAIN to the reviewed public relay hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

networks:
  edge: {}
  backend:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
