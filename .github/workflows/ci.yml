name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Select stable Rust
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit

  deployment-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose model
        run: docker compose -f deploy/compose.yml config

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env SCOTOMA_DOMAIN=relay.example.com
          --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build unprivileged relay image
        run: docker build --file deploy/Dockerfile --tag scotoma-relay:test .
