name: Flutter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/scotoma
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze client
        run: flutter analyze --no-pub

      - name: Test client
        run: flutter test --no-pub

      - name: Enforce source security baseline
        run: dart run tool/verify_source_security.dart

      - name: Build fail-closed web client
        run: flutter build web --release --no-pub
