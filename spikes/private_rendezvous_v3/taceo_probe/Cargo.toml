[package]
name = "scotoma-taceo-client-compile-probe"
version = "0.0.0"
edition = "2024"
publish = false

# This compile-only probe is intentionally isolated from both the v3 state
# model and SCOTOMA's production workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
ark-ec = "=0.6.0"
ark-ff = "=0.6.0"
hkdf = "=0.12.4"
hash2curve = "=0.14.0"
http = "=1.3.1"
sha2 = "=0.10.9"
sha2-011 = { package = "sha2", version = "=0.11.0", default-features = false }
scotoma-private-rendezvous-v3-model = { version = "=0.0.0", path = ".." }
serde_json = "=1.0.151"
taceo-ark-babyjubjub = "=0.6.0"
taceo-oprf-client = "=0.10.8"
taceo-oprf-core = "=0.6.3"
zeroize = "=1.9.1"

[dev-dependencies]
ark-ff = "=0.6.0"
rand = "=0.8.8"
snow = "=0.10.0"
taceo-ark-babyjubjub = "=0.6.0"
uuid = { version = "=1.27.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
