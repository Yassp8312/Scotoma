[package]
name = "scotoma-liboprf-independent-vector"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
blake2 = "=0.10.6"
curve25519-dalek = "=4.1.3"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
getrandom = "=0.3.4"
sha2 = "=0.10.9"
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }

[lints.rust]
unsafe_code = "forbid"
