[workspace]
resolver = "3"
members = [
    "rust/scotoma-protocol",
    "rust/scotoma-relay",
    "rust/scotoma-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary-Pending"
repository = "https://github.com/OWNER/scotoma"

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = { version = "0.11.0", features = ["zeroize"] }
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
