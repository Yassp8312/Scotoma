[package]
name = "scotoma_bridge"
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary-Pending"

# Keep the platform bridge outside the relay workspace and lockfile.
[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", default-features = false, features = [
    "anyhow",
    "dart-opaque",
    "portable-atomic",
    "rust-async",
    "thread-pool",
] }
scotoma-protocol = { version = "=0.1.0", path = "../../../rust/scotoma-protocol" }
getrandom = "=0.3.4"
zeroize = "=1.9.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
scotoma-client = { package = "scotoma-sim", version = "=0.1.0", path = "../../../rust/scotoma-sim" }
tokio = { version = "=1.47.1", features = ["time"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures-channel = "=0.3.34"
futures-util = "=0.3.34"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
js-sys = { version = "=0.3.104", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", default-features = false, features = [
    "std",
    "BinaryType",
    "Event",
    "MessageEvent",
    "WebSocket",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[patch.crates-io]
flutter_rust_bridge = { path = "../../../vendor/flutter_rust_bridge" }
